<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 파일 업로드 화면 -->
  <div id="upload-screen">
    <h1>📖 My Reader</h1>
    <label for="file-input" class="upload-btn">
      TXT 파일 불러오기
    </label>
    <input type="file" id="file-input" accept=".txt" hidden>
  </div>

  <!-- 책 읽기 화면 -->
  <div id="reader-screen" class="hidden">
    <div id="toolbar">
      <button id="back-btn">← 목록</button>
      <span id="book-title"></span>
      <button id="highlight-list-btn">🖍 하이라이트</button>
    </div>
    <div id="content"></div>
  </div>

  <!-- 하이라이트 목록 화면 -->
  <div id="highlight-screen" class="hidden">
    <div id="toolbar">
      <button id="back-from-highlight">← 돌아가기</button>
      <span>하이라이트 목록</span>
    </div>
    <div id="highlight-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
